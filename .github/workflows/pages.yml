name: Build portfolio

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify
      - run: git diff --exit-code -- index.html assets favicon.svg robots.txt sitemap.xml social-preview.png CNAME .nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist
