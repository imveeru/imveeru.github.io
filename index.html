<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractal Glass Parallax Effect | Codegrid</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://use.typekit.net/epc1vbt.css">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&family=Google+Sans+Flex:wght@100..900&family=Instrument+Serif:ital@0;1&family=Manrope:wght@200..800&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
          }
        }
    </script>
</head>

<body>
  <!-- Preloader -->
  <div class="preloader">
    <div class="preloader-text"></div>
    <div class="blind-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <!-- Canvas Container (Shared) -->
  <div id="canvas-container"></div>

  <!-- DESKTOP HERO (> 768px) -->
  <section class="hero-desktop">
    <div class="hero-text-top">
      <p>Building <span class='serif-e'>human-centered </span>systems</p>
      <p>where <span class='serif-e'>creativity</span>, vision &</p>
      <p>machine <span class='serif-e'>intelligence</span> intersect.</p>
    </div>

    <div class="hero-text-bottom">
      <div class="title-container">VEERAMANOHAR</div>
      <div class="hero-tagline">Applied AI Research Engineer</div>
    </div>
  </section>

  <!-- MOBILE HERO (<= 768px) -->
  <section class="hero-mobile">
    <div class="hero-mobile-bg"></div>

    <!-- Using specific classes or scoped styles in CSS -->
    <div class="mobile-header">
      <div class="title-container-mobile">VEERAMANOHAR</div>
      <div class="hero-tagline-mobile">Applied AI Research Engineer</div>
    </div>

    <div class="mobile-body">
      <p>Building <span class='serif-e'>human-centered </span>systems</p>
      <p>where <span class='serif-e'>creativity</span>, vision &</p>
      <p>machine <span class='serif-e'>intelligence</span> intersect.</p>
    </div>
  </section>

  <section class="next-section">
    <div class="content">
      <h2>Coming Soon</h2>
      <p>Stay Tuned</p>
    </div>
  </section>

  <script type="module" src="./script.js"></script>
</body>

</html>
